# validation loss at epoch 6). Trained on 2026-11-20 with an external script
# (run_downstream_gpu.py); see docs/reports/downstream_20261120.
id: deepsc_cta_zheng_1215
type: finetuned
base: deepsc_pretrain_1215
task: cta
dataset: zheng
checkpoint: /DATA2/DeepSC/checkpoints/cta_zheng_1215/best_model.pt
